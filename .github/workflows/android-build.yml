name: Build Time Loop Detective

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    env:
      ANDROID_PLATFORM: "36"
      ANDROID_BUILD_TOOLS: "36.1.0"
      ANDROID_NDK: "29.0.14206865"
      ANDROID_CMAKE: "3.22.1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          packages=(
            "platform-tools"
            "platforms;android-${ANDROID_PLATFORM}"
            "build-tools;${ANDROID_BUILD_TOOLS}"
            "ndk;${ANDROID_NDK}"
            "cmake;${ANDROID_CMAKE}"
          )
          for attempt in 1 2 3; do
            echo "Android SDK install attempt ${attempt}/3"
            if sdkmanager "${packages[@]}"; then
              exit 0
            fi
            rm -rf "${ANDROID_SDK_ROOT}/.temp" "${ANDROID_SDK_ROOT}/temp" || true
            sleep 5
          done
          echo "Android SDK package installation failed after 3 attempts."
          exit 1

      - name: Validate case data
        run: python3 tools/validate_cases.py

      - name: Check image backend syntax
        run: node --check backend/server.js

      - name: Audit visual assets
        run: python3 tools/asset_audit.py

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Configure Android paths
        shell: bash
        run: |
          mkdir -p ~/.config/godot
          godot --headless --editor --quit --path . --editor-settings-path ~/.config/godot
          SETTINGS_FILE=$(find ~/.config/godot -type f -name "editor_settings-*.tres" | head -n 1)
          if [ -n "$SETTINGS_FILE" ]; then
            sed -i '/export\/android\/android_sdk_path/d' "$SETTINGS_FILE"
            sed -i '/export\/android\/java_sdk_path/d' "$SETTINGS_FILE"
            printf '\nexport/android/android_sdk_path = "%s"\n' "${ANDROID_SDK_ROOT}" >> "$SETTINGS_FILE"
            printf 'export/android/java_sdk_path = "%s"\n' "${JAVA_HOME}" >> "$SETTINGS_FILE"
          fi

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Runtime smoke test
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 4 2>&1 | tee runtime.log
          if grep -E "SCRIPT ERROR|Parse Error|Invalid call|ERROR:" runtime.log; then
            echo "Runtime smoke test detected an error."
            exit 1
          fi

      - name: Gameplay flow self-test
        shell: bash
        run: godot --headless --path . --script res://tools/game_flow_test.gd

      - name: Export Android APK
        shell: bash
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android Debug" build/TimeLoopDetective.apk
          test -s build/TimeLoopDetective.apk

      - name: Verify APK packaged content
        shell: bash
        run: |
          unzip -l build/TimeLoopDetective.apk > apk-contents.txt
          grep -q "case_01.json" apk-contents.txt
          grep -q "case_10.json" apk-contents.txt
          grep -q "detective_office" apk-contents.txt
          echo "APK CONTENT VERIFIED: cases and artwork are packaged."

      - name: Detect Play signing secrets
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Play signing secrets are not configured; signed AAB will be skipped."
          fi

      - name: Configure Play release signing
        if: steps.signing.outputs.available == 'true'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p build/signing
          printf '%s' "$KEYSTORE_B64" | base64 --decode > build/signing/release.keystore
          sed -i "s|__RELEASE_KEYSTORE__|$GITHUB_WORKSPACE/build/signing/release.keystore|g" export_presets.cfg
          sed -i "s|__RELEASE_ALIAS__|$KEY_ALIAS|g" export_presets.cfg
          sed -i "s|__RELEASE_PASSWORD__|$KEY_PASSWORD|g" export_presets.cfg

      - name: Export signed Play Store AAB
        if: steps.signing.outputs.available == 'true'
        shell: bash
        run: |
          godot --headless --path . --export-release "Android Release" build/TimeLoopDetective.aab
          test -s build/TimeLoopDetective.aab

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: TimeLoopDetective-Android-1.6.0
          path: build/TimeLoopDetective.apk
          if-no-files-found: error

      - name: Upload signed Play Store AAB
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: TimeLoopDetective-Play-AAB-1.6.0
          path: build/TimeLoopDetective.aab
          if-no-files-found: error
