name: Build Godot Android APK

on:
  push:
    branches: [main, feature/godot-migration]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Verify Godot project
        run: godot --headless --path . --editor --quit

      - name: Build Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/TimeLoopDetective.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: time-loop-detective-android
          path: build/TimeLoopDetective.apk
          if-no-files-found: error
