name: Build Time Loop Detective

on:
  push:
    branches: [main, feature/case-one-rebuild, feature/cases-2-to-5]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-24.04
    env:
      ANDROID_PLATFORM: "35"
      ANDROID_BUILD_TOOLS: "35.0.0"
      ANDROID_NDK: "29.0.14206865"
      ANDROID_CMAKE: "3.22.1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          packages=(
            "platform-tools"
            "platforms;android-${ANDROID_PLATFORM}"
            "build-tools;${ANDROID_BUILD_TOOLS}"
            "ndk;${ANDROID_NDK}"
            "cmake;${ANDROID_CMAKE}"
          )
          for attempt in 1 2 3; do
            echo "Android SDK install attempt ${attempt}/3"
            if sdkmanager "${packages[@]}"; then
              exit 0
            fi
            rm -rf "${ANDROID_SDK_ROOT}/.temp" "${ANDROID_SDK_ROOT}/temp" || true
            sleep 5
          done
          echo "Android SDK package installation failed after 3 attempts."
          exit 1

      - name: Validate case data
        run: python3 tools/validate_cases.py

      - name: Check image backend syntax
        run: node --check backend/server.js

      - name: Audit visual assets
        run: python3 tools/asset_audit.py

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: true

      - name: Configure Android paths
        shell: bash
        run: |
          mkdir -p ~/.config/godot
          godot --headless --editor --quit --path . --editor-settings-path ~/.config/godot
          SETTINGS_FILE=$(find ~/.config/godot -type f -name "editor_settings-*.tres" | head -n 1)
          if [ -n "$SETTINGS_FILE" ]; then
            sed -i '/export\/android\/android_sdk_path/d' "$SETTINGS_FILE"
            sed -i '/export\/android\/java_sdk_path/d' "$SETTINGS_FILE"
            printf '\nexport/android/android_sdk_path = "%s"\n' "${ANDROID_SDK_ROOT}" >> "$SETTINGS_FILE"
            printf 'export/android/java_sdk_path = "%s"\n' "${JAVA_HOME}" >> "$SETTINGS_FILE"
          fi


      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Runtime smoke test
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 4 2>&1 | tee runtime.log
          if grep -E "SCRIPT ERROR|Parse Error|Invalid call|ERROR:" runtime.log; then
            echo "Runtime smoke test detected an error."
            exit 1
          fi

      - name: Gameplay flow self-test
        shell: bash
        run: godot --headless --path . --script res://tools/game_flow_test.gd

      - name: Export Android APK
        shell: bash
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android Debug" build/TimeLoopDetective.apk

      - name: Verify APK packaged content
        shell: bash
        run: |
          test -s build/TimeLoopDetective.apk
          unzip -l build/TimeLoopDetective.apk > apk-contents.txt
          grep -q "case_01.json" apk-contents.txt
          grep -q "case_10.json" apk-contents.txt
          grep -q "detective_office" apk-contents.txt
          echo "APK CONTENT VERIFIED: cases and artwork are packaged."

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: TimeLoopDetective-Android
          path: build/TimeLoopDetective.apk
          if-no-files-found: error
