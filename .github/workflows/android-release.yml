name: Build Signed Android AAB

on:
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-release:
    runs-on: ubuntu-24.04
    env:
      ANDROID_PLATFORM: "36"
      ANDROID_BUILD_TOOLS: "36.1.0"
      ANDROID_NDK: "29.0.14206865"
      ANDROID_CMAKE: "3.22.1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          packages=(
            "platform-tools"
            "platforms;android-${ANDROID_PLATFORM}"
            "build-tools;${ANDROID_BUILD_TOOLS}"
            "ndk;${ANDROID_NDK}"
            "cmake;${ANDROID_CMAKE}"
          )
          for attempt in 1 2 3; do
            echo "Android SDK install attempt ${attempt}/3"
            if sdkmanager "${packages[@]}"; then
              exit 0
            fi
            rm -rf "${ANDROID_SDK_ROOT}/.temp" "${ANDROID_SDK_ROOT}/temp" || true
            sleep 5
          done
          exit 1

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Configure Android paths
        shell: bash
        run: |
          mkdir -p ~/.config/godot
          godot --headless --editor --quit --path . --editor-settings-path ~/.config/godot
          SETTINGS_FILE=$(find ~/.config/godot -type f -name "editor_settings-*.tres" | head -n 1)
          sed -i '/export\/android\/android_sdk_path/d' "$SETTINGS_FILE"
          sed -i '/export\/android\/java_sdk_path/d' "$SETTINGS_FILE"
          printf '\nexport/android/android_sdk_path = "%s"\n' "${ANDROID_SDK_ROOT}" >> "$SETTINGS_FILE"
          printf 'export/android/java_sdk_path = "%s"\n' "${JAVA_HOME}" >> "$SETTINGS_FILE"

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p build/signing
          printf '%s' "$KEYSTORE_B64" | base64 --decode > build/signing/release.keystore
          sed -i "s|__RELEASE_KEYSTORE__|$GITHUB_WORKSPACE/build/signing/release.keystore|g" export_presets.cfg
          sed -i "s|__RELEASE_ALIAS__|$KEY_ALIAS|g" export_presets.cfg
          sed -i "s|__RELEASE_PASSWORD__|$KEY_PASSWORD|g" export_presets.cfg

      - name: Validate and test
        shell: bash
        run: |
          python3 tools/validate_cases.py
          python3 tools/asset_audit.py
          godot --headless --editor --path . --quit
          godot --headless --path . --script res://tools/game_flow_test.gd

      - name: Export signed AAB
        shell: bash
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Android Release" build/TimeLoopDetective.aab
          test -s build/TimeLoopDetective.aab

      - name: Upload AAB
        uses: actions/upload-artifact@v7
        with:
          name: TimeLoopDetective-Play-AAB-1.6.0
          path: build/TimeLoopDetective.aab
          if-no-files-found: error
